<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Film Dispo Tool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-gray-100 p-6 font-sans text-gray-800">
  <div class="max-w-5xl mx-auto bg-white p-6 rounded shadow space-y-6">
    <h1 class="text-2xl font-bold text-center">Tagesdisposition</h1>

    <!-- Projektinfos -->
    <input id="project" placeholder="Projektname" class="border p-2 rounded w-full mb-2" />
    <input id="slogan" placeholder="Slogan" class="border p-2 rounded w-full mb-2" />
    <input id="date" type="date" class="border p-2 rounded w-full mb-2" />
    <input id="company" placeholder="Produktionsfirma" class="border p-2 rounded w-full mb-2" />

    <!-- Wetter und Krankenhaus -->
    <textarea id="wetter" placeholder="Wetter" class="border p-2 rounded w-full mb-2"></textarea>
    <textarea id="krankenhaus" placeholder="Krankenhaus" class="border p-2 rounded w-full mb-2"></textarea>

    <!-- Shotlist -->
    <h2 class="text-lg font-semibold">Shotlist</h2>
    <table class="w-full text-sm border mb-2" id="shotlist">
      <thead>
        <tr>
          <th>Zeit</th><th>Bildnr</th><th>Szene</th><th>Requisiten</th><th></th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><input type="text" class="w-full p-1 border" /></td>
          <td><input type="text" class="w-full p-1 border" /></td>
          <td><input type="text" class="w-full p-1 border" /></td>
          <td><input type="text" class="w-full p-1 border" /></td>
          <td><button class="remove text-red-500 text-xs">X</button></td>
        </tr>
      </tbody>
    </table>
    <button id="add-shot" class="text-indigo-600 text-sm">+ Shot hinzufügen</button>

    <!-- Rollenplan -->
    <h2 class="text-lg font-semibold">Rollenplan</h2>
    <table class="w-full text-sm border mb-2" id="rollenplan">
      <thead>
        <tr>
          <th>Rolle</th><th>Name</th><th>Ankunft</th><th>Maske</th><th>Drehfertig</th><th></th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><input type="text" class="w-full p-1 border" /></td>
          <td><input type="text" class="w-full p-1 border" /></td>
          <td><input type="time" class="w-full p-1 border" /></td>
          <td><input type="time" class="w-full p-1 border" /></td>
          <td><input type="time" class="w-full p-1 border" /></td>
          <td><button class="remove text-red-500 text-xs">X</button></td>
        </tr>
      </tbody>
    </table>
    <button id="add-rolle" class="text-indigo-600 text-sm">+ Rolle hinzufügen</button>
        <!-- Stabliste -->
    <h2 class="text-lg font-semibold">Stabliste</h2>
    <table class="w-full text-sm border mb-2" id="stabliste">
      <thead>
        <tr>
          <th>Abteilung</th><th>Name</th><th>E-Mail</th><th>Telefon</th><th></th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><input type="text" class="w-full p-1 border" /></td>
          <td><input type="text" class="w-full p-1 border" /></td>
          <td><input type="email" class="w-full p-1 border" /></td>
          <td><input type="text" class="w-full p-1 border" /></td>
          <td><button class="remove text-red-500 text-xs">X</button></td>
        </tr>
      </tbody>
    </table>
    <button id="add-stab" class="text-indigo-600 text-sm">+ Stab hinzufügen</button>

    <!-- PDF Export -->
    <div class="text-right mt-4">
      <button id="export" class="bg-indigo-600 text-white px-4 py-2 rounded">Dispo als PDF exportieren</button>
    </div>
  </div>

  <script>
    const { jsPDF } = window.jspdf;

    // Hilfsfunktionen für Tabellenzeilen
    const addRow = (tableId, html) => {
      const row = document.createElement('tr');
      row.innerHTML = html;
      document.querySelector(`#${tableId} tbody`).appendChild(row);
    };

    // Add Buttons
    document.getElementById('add-shot').onclick = () =>
      addRow('shotlist', `
        <td><input type="text" class="w-full p-1 border" /></td>
        <td><input type="text" class="w-full p-1 border" /></td>
        <td><input type="text" class="w-full p-1 border" /></td>
        <td><input type="text" class="w-full p-1 border" /></td>
        <td><button class="remove text-red-500 text-xs">X</button></td>
      `);

    document.getElementById('add-rolle').onclick = () =>
      addRow('rollenplan', `
        <td><input type="text" class="w-full p-1 border" /></td>
        <td><input type="text" class="w-full p-1 border" /></td>
        <td><input type="time" class="w-full p-1 border" /></td>
        <td><input type="time" class="w-full p-1 border" /></td>
        <td><input type="time" class="w-full p-1 border" /></td>
        <td><button class="remove text-red-500 text-xs">X</button></td>
      `);

    document.getElementById('add-stab').onclick = () =>
      addRow('stabliste', `
        <td><input type="text" class="w-full p-1 border" /></td>
        <td><input type="text" class="w-full p-1 border" /></td>
        <td><input type="email" class="w-full p-1 border" /></td>
        <td><input type="text" class="w-full p-1 border" /></td>
        <td><button class="remove text-red-500 text-xs">X</button></td>
      `);

    // Entfernen-Buttons
    document.addEventListener('click', e => {
      if (e.target.classList.contains('remove')) {
        e.target.closest('tr').remove();
      }
    });
        // PDF Export-Funktion
    document.getElementById('export').onclick = () => {
      const doc = new jsPDF();
      let y = 10;

      const writeLine = (label, value) => {
        doc.text(`${label}: ${value}`, 10, y);
        y += 8;
      };

      // Kopfbereich
      writeLine("Projekt", document.getElementById('project').value);
      writeLine("Slogan", document.getElementById('slogan').value);
      writeLine("Datum", document.getElementById('date').value);
      writeLine("Produktionsfirma", document.getElementById('company').value);
      writeLine("Wetter", document.getElementById('wetter').value);
      writeLine("Krankenhaus", document.getElementById('krankenhaus').value);

      // Tabellen exportieren
      const writeTable = (title, tableId) => {
        doc.addPage();
        let y = 20;
        doc.setFontSize(14);
        doc.text(title, 10, y);
        y += 10;
        doc.setFontSize(11);
        document.querySelectorAll(`#${tableId} tbody tr`).forEach(row => {
          const values = [...row.querySelectorAll('input')].map(input => input.value || '—');
          doc.text(values.join(" | "), 10, y);
          y += 7;
          if (y > 270) {
            doc.addPage();
            y = 20;
          }
        });
      };

      writeTable("Shotlist", "shotlist");
      writeTable("Rollenplan", "rollenplan");
      writeTable("Stabliste", "stabliste");

      // Speichern
      doc.save("Tagesdisposition.pdf");
    };
  </script>
</body>
</html>
